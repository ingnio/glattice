name: Release

# Pushing a tag like v0.2.0 builds the Windows installers and attaches
# them to a draft GitHub release. Review the draft, then publish it.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Build installers
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Glattice ${{ github.ref_name }}
          releaseBody: See CHANGELOG.md for what changed in this version.
          releaseDraft: true
          prerelease: false
