[package]
name = "glattice"
version = "0.1.0"
description = "Screen capture to annotated sprite sheets"
authors = ["Glattice Contributors"]
license = "MIT"
repository = "https://github.com/ingnio/glattice"
edition = "2021"

[lib]
name = "glattice_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-store = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
parking_lot = "0.12"
once_cell = "1"

# Screen capture. The spec mentioned `scap` but its Windows engine is
# currently broken on every crates.io release — the declared
# windows-capture version doesn't match scap's own code (method renames,
# arg-count changes). Switched to `xcap` which is maintained, compiles
# cleanly on Windows, and exposes a simple polling capture API that
# suits the low-FPS bug-repro use case fine.
xcap = "0.9"

# Parallel frame quantization for the standard GIF encoder.
rayon = "1"
# Vector font rasterization for sprite-sheet annotations.
ab_glyph = "0.2"
# GIF encode/decode
gif = "0.13"
# Image composition for sprite sheet
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
# Cross-platform drag-out — initiates an OS-level drag with a file
# payload from a Tauri webview. Used for "drag the GIF straight into
# Slack / Discord / a file manager" without going through a save
# dialog.
drag = "2"

# Microphone capture (cross-platform). Used opt-in by the recording
# flow when the user enables "Record audio" — frames + audio are
# muxed together into MP4 / WebM exports on the frontend.
cpal = "0.15"
# Tiny PCM-WAV writer. Audio samples land on disk next to the
# recording so the frontend can decode + re-encode at export time.
hound = "3"

# High-quality GIF encoder (pngquant-based palette optimization).
# AGPL-3.0-or-later — intentionally opt-in via the `gifski` cargo feature
# so default builds stay MIT-clean. Enable with
# `cargo tauri build --features glattice/gifski` or
# `cargo build --features gifski` from src-tauri.
gifski = { version = "1", default-features = false, optional = true }
imgref = { version = "1", optional = true }
rgb = { version = "0.8", default-features = false, features = ["bytemuck"], optional = true }

[features]
default = []
gifski = ["dep:gifski", "dep:imgref", "dep:rgb"]

# Win32 APIs for GetCursorPos + SetWindowPos. Version must match what
# Tauri itself pulls in (otherwise `webview_window.hwnd()` returns a
# type incompatible with ours).
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", default-features = false, features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
] }
